<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识混子 - 个人导航</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    background: 
      linear-gradient(to bottom, rgba(10, 25, 35, 0.55), rgba(5, 15, 25, 0.75)),
      url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=misty%20pine%20forest%20dark%20blue%20teal%20foggy%20atmosphere%20night%20moody%20cinematic&image_size=landscape_16_9');
    background-size: cover;
    background-position: center;
    color: #e0e8ec;
    overflow-x: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 30px 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top Section */
  .top-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 40px;
    flex: 1;
  }

  /* Left Column */
  .left-column {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 30px;
    max-width: 380px;
  }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .site-title {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: #f0f4f8;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    line-height: 1;
    letter-spacing: 2px;
  }

  .quote-card {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 28px 32px;
    position: relative;
    margin-top: 10px;
  }

  .quote-marks {
    font-size: 52px;
    color: rgba(180, 210, 220, 0.35);
    font-family: Georgia, serif;
    line-height: 0.6;
    margin-bottom: 10px;
  }

  .quote-text {
    font-size: 15px;
    line-height: 1.8;
    color: #c8d6de;
    margin-bottom: 8px;
  }

  .quote-text em {
    font-family: 'Dancing Script', cursive;
    font-style: italic;
    font-size: 22px;
    color: #e8f0f4;
    display: block;
    margin-bottom: 6px;
  }

  .quote-icon {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    color: rgba(200, 214, 222, 0.6);
    font-size: 18px;
  }

  .quote-icon span {
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    transition: all 0.3s;
    cursor: pointer;
  }

  .quote-icon span:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }

  /* Right Column */
  .right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 25px;
    max-width: 620px;
  }

  /* Clock Section */
  .clock-section {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px 28px;
  }

  .quote-section {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 18px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
    position: relative;
  }

  .quote-section:hover {
    background: rgba(30, 60, 80, 0.65);
    border-color: rgba(120, 200, 220, 0.3);
    transform: translateY(-2px);
  }

  .quote-section.loading {
    opacity: 0.5;
    pointer-events: none;
  }

  .quote-of-day {
    font-size: 15px;
    color: #c8d6de;
    line-height: 1.8;
  }

  .quote-of-day .original {
    color: #7fc8d8;
    font-size: 12px;
  }

  .date-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .weather {
    font-size: 13px;
    color: #a8bcc8;
    text-align: right;
    line-height: 1.6;
  }

  .date-label {
    font-size: 14px;
    color: #b8c8d4;
    margin-bottom: 6px;
  }

  .clock {
    font-family: 'Orbitron', monospace;
    font-size: 42px;
    font-weight: 700;
    color: #e8f4f8;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(120, 200, 220, 0.3);
    line-height: 1;
  }

  /* Website List */
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    color: #d8e4ec;
    margin-bottom: 14px;
    font-weight: 500;
  }

  .section-title .icon {
    font-size: 18px;
  }

  .website-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .website-card {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .website-card:hover {
    background: rgba(30, 60, 80, 0.65);
    border-color: rgba(120, 200, 220, 0.3);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .website-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(120, 200, 220, 0.12);
    color: #8fd4e2;
  }

  .website-name {
    font-size: 14px;
    color: #d0dce4;
    font-weight: 400;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .top-section {
      flex-direction: column;
    }
    .left-column, .right-column {
      max-width: 100%;
      width: 100%;
    }
    .website-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .clock {
      font-size: 32px;
    }
    .site-title {
      font-size: 36px;
    }
  }

  @media (max-width: 500px) {
    .website-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .container {
      padding: 20px 16px;
    }
    .clock {
      font-size: 28px;
    }
    .date-row {
      flex-direction: column;
      gap: 10px;
    }
    .weather {
      text-align: left;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-section">
    <!-- Left Column -->
    <div class="left-column">
      <div class="profile-row">
        <div class="avatar">
          <img src="https://images.xxapi.cn/images/head/0896648880.jpg" alt="avatar">
        </div>
        <div class="site-title">知识混子</div>
      </div>

      <div class="quote-card">
        <div class="quote-marks">"</div>
        <div class="quote-text">
          <em>Hello World!</em>
          一个建立于 21 世纪的小站，存活于互联网的边缘
        </div>
        <div class="quote-icon">
          <span title="朋友圈">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </span>
          <span title="邮箱">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="right-column">
      <!-- Clock & Weather -->
      <div class="clock-section">
        <div class="date-row">
          <div>
            <div class="date-label" id="dateLabel">2026 年 07 月 30 日 星期四</div>
            <div class="clock" id="clock">09:27:24</div>
          </div>
          <div class="weather">
            张家口市晴 27°C<br>
            东南风 ≤3 级
          </div>
        </div>
      </div>

      <!-- Quote Section -->
      <div class="quote-section" id="quoteSection" title="点击换一句">
        <div class="quote-of-day" id="quoteText">
          点击获取句子...
        </div>
      </div>

      <!-- Website List -->
      <div>
        <div class="section-title">
          <span class="icon">💻</span>
          网站列表
        </div>
        <div class="website-grid">
          <a href="#" class="website-card">
            <div class="website-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <div class="website-name">博客</div>
          </a>
          <a href="#" class="website-card">
            <div class="website-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            </div>

          </a>
          <a href="#" class="website-card">
            <div class="website-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>

          </a>
          <a href="#" class="website-card">

              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </div>
            <div class="website-name">B站</div>
          </a>
          <a href="#" class="website-card">
            <div class="website-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>

              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

  </div>

  
</div>

<script>
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    const weekDay = weekDays[now.getDay()];
    document.getElementById('dateLabel').textContent = 
      `${year} 年 ${month} 月 ${day} 日 星期${weekDay}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  const quoteSection = document.getElementById('quoteSection');
  const quoteText = document.getElementById('quoteText');

  async function fetchQuote() {
    quoteSection.classList.add('loading');
    quoteText.textContent = '加载中...';
    try {
      const res = await fetch('https://api.timelessq.com/sentence');
      const json = await res.json();
      if (json.errno === 0 && json.data) {
        const { hitokoto, from, from_who } = json.data;
        let html = hitokoto;
        if (from_who || from) {
          html += `<br>— <span class="original">${from_who || ''}${from ? '《' + from + '》' : ''}</span>`;
        }
        quoteText.innerHTML = html;
      } else {
        quoteText.textContent = '获取失败，请重试';
      }
    } catch (e) {
      quoteText.textContent = '网络错误，点击重试';
    } finally {
      quoteSection.classList.remove('loading');
    }
  }

  quoteSection.addEventListener('click', fetchQuote);
  fetchQuote();
</script>
</body>
</html>
