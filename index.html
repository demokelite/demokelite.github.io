<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识混子 - 个人导航</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    background: 
      linear-gradient(to bottom, rgba(10, 25, 35, 0.55), rgba(5, 15, 25, 0.75)),
      url('https://t.alcy.cc/fj');
    background-size: cover;
    background-position: center;
    color: #e0e8ec;
    overflow-x: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 30px 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top Section */
  .top-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 40px;
    flex: 1;
  }

  /* Left Column */
  .left-column {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 30px;
    max-width: 380px;
  }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .site-title {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: #f0f4f8;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    line-height: 1;
    letter-spacing: 2px;
  }

  .quote-card {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 28px 32px;
    position: relative;
    margin-top: 10px;
  }

  .quote-marks {
    font-size: 52px;
    color: rgba(180, 210, 220, 0.35);
    font-family: Georgia, serif;
    line-height: 0.6;
    margin-bottom: 10px;
  }

  .quote-text {
    font-size: 15px;
    line-height: 1.8;
    color: #c8d6de;
    margin-bottom: 8px;
  }

  .quote-text em {
    font-family: 'Noto Sans SC', sans-serif;
    font-style: normal;
    font-size: 18px;
    font-weight: 500;
    color: #e8f0f4;
    display: block;
    margin-bottom: 6px;
  }

  .quote-icon {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    color: rgba(200, 214, 222, 0.6);
    font-size: 18px;
  }

  .quote-icon span {
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    transition: all 0.3s;
    cursor: pointer;
  }

  .quote-icon span:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }

  /* Right Column */
  .right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 25px;
    max-width: 620px;
  }

  /* Clock + Quote Side-by-Side */
  .top-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* Clock Section */
  .clock-section {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px 24px;
  }

  .quote-section {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 18px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
    position: relative;
  }

  .quote-section:hover {
    background: rgba(30, 60, 80, 0.65);
    border-color: rgba(120, 200, 220, 0.3);
    transform: translateY(-2px);
  }

  .quote-section.loading {
    opacity: 0.5;
    pointer-events: none;
  }

  .quote-of-day {
    font-size: 15px;
    color: #c8d6de;
    line-height: 1.8;
  }

  .quote-of-day .original {
    color: #7fc8d8;
    font-size: 12px;
  }

  .date-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .weather {
    font-size: 13px;
    color: #a8bcc8;
    text-align: left;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .weather-city {
    font-size: 12px;
    color: #8fa8b8;
    font-weight: 500;
  }
  .weather-main {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .weather-text {
    font-size: 14px;
    color: #c8dce8;
  }
  .weather-temp {
    font-size: 16px;
    font-weight: 600;
    color: #7ec8e3;
  }
  .weather-sub {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: #8fa8b8;
  }

  .date-label {
    font-size: 13px;
    color: #b8c8d4;
    margin-bottom: 6px;
  }

  .clock {
    font-family: 'Orbitron', monospace;
    font-size: 36px;
    font-weight: 700;
    color: #e8f4f8;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(120, 200, 220, 0.3);
    line-height: 1;
  }

  .quote-section {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .quote-section:hover {
    background: rgba(30, 60, 80, 0.65);
    border-color: rgba(120, 200, 220, 0.3);
    transform: translateY(-2px);
  }

  .quote-section.loading {
    opacity: 0.5;
    pointer-events: none;
  }

  .quote-of-day {
    font-size: 14px;
    color: #c8d6de;
    line-height: 1.8;
  }

  .quote-of-day .original {
    color: #7fc8d8;
    font-size: 12px;
  }

  /* Website List */
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    color: #d8e4ec;
    margin-bottom: 14px;
    font-weight: 500;
  }

  .section-title .icon {
    font-size: 18px;
  }

  .website-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .website-card {
    background: rgba(15, 30, 40, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .website-card:hover {
    background: rgba(30, 60, 80, 0.65);
    border-color: rgba(120, 200, 220, 0.3);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .website-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(120, 200, 220, 0.12);
    color: #8fd4e2;
  }

  .website-name {
    font-size: 14px;
    color: #d0dce4;
    font-weight: 400;
  }

  /* Huangli Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.25s ease;
  }

  .modal-overlay.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-content {
    background: linear-gradient(145deg, rgba(20, 40, 55, 0.95), rgba(15, 30, 40, 0.98));
    border: 1px solid rgba(120, 200, 220, 0.2);
    border-radius: 16px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: slideUp 0.3s ease;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .modal-title {
    font-size: 18px;
    font-weight: 600;
    color: #e8f0f4;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #c8d6de;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .modal-close:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }

  .huangli-section {
    padding: 20px 24px 24px;
  }

  .huangli-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .huangli-title {
    font-size: 14px;
    font-weight: 500;
    color: #b0c4cf;
  }

  .huangli-shichen {
    font-size: 22px;
    font-weight: 700;
    color: #f0d89a;
    letter-spacing: 2px;
  }

  .huangli-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 24px;
  }

  .huangli-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .huangli-label {
    font-size: 12px;
    color: #7fc8d8;
    font-weight: 500;
  }

  .huangli-value {
    font-size: 13px;
    color: #c8d6de;
    line-height: 1.5;
  }

  .huangli-value.yi {
    color: #a8e6cf;
  }

  .huangli-value.ji {
    color: #ffb4b4;
  }

  .huangli-footer {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(180, 200, 210, 0.6);
  }

  .huangli-footer span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* 吉时凶时 */
  .huangli-auspicious {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .huangli-auspicious-title {
    font-size: 13px;
    color: #d8e4ec;
    font-weight: 500;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .shichen-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .shichen-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.3s ease;
  }

  .shichen-item .sc-name {
    font-weight: 600;
    color: #e8f0f4;
    min-width: 70px;
  }

  .shichen-item .sc-time {
    color: #8a9bab;
    flex: 1;
    margin: 0 10px;
    font-size: 11px;
  }

  .shichen-item .sc-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
  }

  /* 吉时 - 绿色 */
  .shichen-item.yi .sc-name {
    color: #a8e6cf;
  }

  .shichen-item.yi .sc-tag {
    background: rgba(168, 230, 207, 0.15);
    color: #a8e6cf;
  }

  /* 凶时 - 红色 */
  .shichen-item.ji .sc-name {
    color: #ffb4b4;
  }

  .shichen-item.ji .sc-tag {
    background: rgba(255, 180, 180, 0.15);
    color: #ffb4b4;
  }

  /* 已过去 - 灰色 */
  .shichen-item.past .sc-name,
  .shichen-item.past .sc-time {
    color: #5a6a7a !important;
  }

  .shichen-item.past {
    opacity: 0.55;
    background: rgba(255,255,255,0.015);
  }

  .shichen-item.past .sc-tag {
    background: rgba(120, 140, 150, 0.1);
    color: #6a7a8a;
  }

  /* 当前时辰 - 高亮 */
  .shichen-item.current {
    background: rgba(240, 216, 154, 0.15);
    border: 1px solid rgba(240, 216, 154, 0.5);
    box-shadow: 0 0 12px rgba(240, 216, 154, 0.15);
  }

  .shichen-item.current .sc-name {
    color: #f0d89a !important;
  }

  .shichen-item.current::before {
    content: '●';
    position: absolute;
    margin-right: 6px;
  }

  .shichen-item {
    position: relative;
  }

  .shichen-group-title {
    font-size: 12px;
    color: #7fc8d8;
    margin: 12px 0 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 求签弹窗 */
  .qiuqian-modal {
    max-width: 420px;
  }

  .qiuqian-body {
    padding: 24px;
    text-align: center;
  }

  .qiuqian-title {
    font-size: 16px;
    color: #f0d89a;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .qiuqian-content {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 24px 20px;
    margin-bottom: 20px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .qiuqian-placeholder {
    color: #7a8a9a;
    font-size: 14px;
  }

  .qiuqian-poem {
    font-size: 15px;
    color: #d8e4ec;
    line-height: 2;
    margin-bottom: 16px;
    white-space: pre-line;
  }

  .qiuqian-meaning {
    font-size: 13px;
    color: #a8bcc8;
    line-height: 1.8;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .qiuqian-footer {
    margin-bottom: 20px;
  }

  .qiuqian-meta {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 13px;
    color: #8a9bab;
  }

  .qiuqian-meta span {
    padding: 4px 12px;
    background: rgba(120, 200, 220, 0.1);
    border-radius: 6px;
  }

  .qiuqian-btn {
    width: 100%;
    padding: 14px 24px;
    background: linear-gradient(135deg, rgba(240, 216, 154, 0.2), rgba(200, 160, 100, 0.15));
    border: 1px solid rgba(240, 216, 154, 0.4);
    border-radius: 10px;
    color: #f0d89a;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .qiuqian-btn:hover {
    background: linear-gradient(135deg, rgba(240, 216, 154, 0.3), rgba(200, 160, 100, 0.25));
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(240, 216, 154, 0.2);
  }

  .qiuqian-btn:active {
    transform: translateY(0);
  }

  .qiuqian-btn.loading {
    opacity: 0.6;
    pointer-events: none;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .top-section {
      flex-direction: column;
    }
    .left-column, .right-column {
      max-width: 100%;
      width: 100%;
    }
    .website-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .clock {
      font-size: 32px;
    }
    .site-title {
      font-size: 36px;
    }
    .top-row {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 500px) {
    .website-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .container {
      padding: 20px 16px;
    }
    .clock {
      font-size: 28px;
    }
    .date-row {
      flex-direction: column;
      gap: 10px;
    }
    .weather {
      text-align: left;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-section">
    <!-- Left Column -->
    <div class="left-column">
      <div class="profile-row">
        <div class="avatar">
          <img src="https://images.xxapi.cn/images/head/0896648880.jpg" alt="avatar">
        </div>
        <div class="site-title">知识混子</div>
      </div>

      <div class="quote-card">
        <div class="quote-marks">"</div>
        <div class="quote-text" id="ipInfo">
          <div style="font-size: xx-large;">欢迎来自</div>
          <em id="ipLocation" style="font-size: large;color: #0a959f;" >加载位置信息中...</em>

    </div>

    <!-- Right Column -->
    <div class="right-column">
      <!-- Clock + Quote Side-by-Side -->
      <div class="top-row">
        <!-- Clock & Weather -->
        <div class="clock-section">
          <div class="date-row">
            <div>
              <div class="date-label" id="dateLabel">2026 年 07 月 30 日 星期四</div>
              <div class="clock" id="clock">09:27:24</div>
            </div>
            <div class="weather" id="weatherInfo">
              加载中...

          </div>
        </div>

        <!-- Quote Section -->
        <div class="quote-section" id="quoteSection" title="点击换一句">
          <div class="quote-of-day" id="quoteText">
            点击获取句子...
          </div>
        </div>
      </div>

      <!-- Huangli Modal -->
      <div class="modal-overlay" id="huangliModal">
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-title">
              <span>📜</span>
              今日黄历
            </div>
            <button class="modal-close" id="hlCloseBtn">✕</button>

          <div class="huangli-section">

            </div>
            <div class="huangli-body">
              <div class="huangli-row">
                <div class="huangli-label">宜</div>

              <div class="huangli-row">
                <div class="huangli-label">忌</div>
                <div class="huangli-value ji" id="hlJi">加载中...</div>
              </div>
              <div class="huangli-row">
                <div class="huangli-label">冲</div>
                <div class="huangli-value" id="hlChong">—</div>
              </div>
              <div class="huangli-row">
                <div class="huangli-label">煞</div>
                <div class="huangli-value" id="hlSha">—</div>
              </div>
            </div>
            <div class="huangli-footer">
              <span id="hlNayin">纳音：—</span>

<script>
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    const weekDay = weekDays[now.getDay()];
    document.getElementById('dateLabel').textContent = 
      `${year} 年 ${month} 月 ${day} 日 星期${weekDay}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  const apiHeaders = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
    'Accept': 'application/json, text/plain, */*',
    'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
    'Referer': 'https://www.google.com/',
    'Origin': 'https://www.google.com'
  };

  const quoteSection = document.getElementById('quoteSection');
  const quoteText = document.getElementById('quoteText');

  async function fetchQuote() {
    quoteSection.classList.add('loading');
    quoteText.textContent = '加载中...';
    try {
      const res = await fetch('https://api.timelessq.com/sentence', { headers: apiHeaders });
      const json = await res.json();
      if (json.errno === 0 && json.data) {
        const { hitokoto, from, from_who } = json.data;
        let html = hitokoto;
        if (from_who || from) {
          html += `<br>— <span class="original">${from_who || ''}${from ? '《' + from + '》' : ''}</span>`;
        }
        quoteText.innerHTML = html;
      } else {
        quoteText.textContent = '获取失败，请重试';
      }
    } catch (e) {
      quoteText.textContent = '网络错误，点击重试';
    } finally {
      quoteSection.classList.remove('loading');
    }
  }

  quoteSection.addEventListener('click', fetchQuote);
  fetchQuote();

  async function fetchIpInfo() {
    const ipLoc = document.getElementById('ipLocation');
    const ipDet = document.getElementById('ipDetail');
    const weatherInfo = document.getElementById('weatherInfo');

    let localIps = [];
    let publicIps = [];

    try {
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });
      pc.createDataChannel('');
      pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});

      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('timeout')), 3000);
        pc.onicecandidate = (e) => {
          if (!e.candidate) {
            clearTimeout(timeout);
            resolve();
            return;
          }
          const parts = e.candidate.candidate.split(' ');
          const ip = parts[4];
          const type = parts[7];
          if (ip && /\d+\.\d+\.\d+\.\d+/.test(ip)) {
            if (type === 'host') {
              localIps.push(ip);
            } else if (type === 'srflx') {
              publicIps.push(ip);
            }
          }
        };
        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === 'complete') {
            clearTimeout(timeout);
            resolve();
          }
        };
      });
      pc.close();
    } catch (e) { /* WebRTC failed, will use fallback */ }

    const displayIp = publicIps[0] || localIps[0] || '';
    const localIp = localIps.find(ip => ip !== displayIp) || localIps[0] || '';

    if (displayIp) {
      try {
        let locData = null;
        try {
          const locRes = await fetch('https://uapis.cn/api/v1/network/ipinfo?ip=' + displayIp, { headers: apiHeaders });
          locData = await locRes.json();
        } catch (e) {
          // fallback to v2.xxapi.cn
          const fallbackRes = await fetch('https://v2.xxapi.cn/api/ip?ip=' + displayIp, { headers: apiHeaders });
          const fallbackData = await fallbackRes.json();
          console.log(fallbackData);
          if (fallbackData.data && fallbackData.data.address) {
            locData = {
              ip: displayIp,
              region: fallbackData.data.address,
              city: extractCityFromAddress(fallbackData.data.address)
            };
          }
        }

        if (locData && (locData.ip || locData.region)) {
          const region = locData.region || '未知位置';
          ipLoc.textContent = region + '的用户';
          ipDet.textContent = '访问本站';
          const city = extractCity(locData);
          if (city) {
            fetchWeather(city);
          } else {
            weatherInfo.textContent = '天气信息暂不可用';
          }
        } else {
          ipLoc.textContent = '欢迎访问';
          ipDet.textContent = '位置查询失败';
          weatherInfo.textContent = '天气信息暂不可用';
        }
      } catch (e) {
        ipLoc.textContent = '欢迎访问';
        ipDet.textContent = '位置查询失败';
        weatherInfo.textContent = '天气信息暂不可用';
      }
    } else {
      ipLoc.textContent = '欢迎访问';
      ipDet.textContent = 'WebRTC不可用';
      weatherInfo.textContent = '天气信息暂不可用';
    }
  }
  fetchIpInfo();

  function extractCity(locData) {
    if (!locData) return '';
    if (locData.city && typeof locData.city === 'string' && locData.city.length > 0) return locData.city;
    if (locData.province && typeof locData.province === 'string' && locData.province.length > 0) return locData.province;
    if (locData.region) {
      const parts = locData.region.split(/[省市自治区特别行政区]/);
      for (const p of parts) {
        if (p && p.length >= 2 && p.length <= 5) return p;
      }
    }
    return '';
  }

  function extractCityFromAddress(address) {
    if (!address) return '';
    const match = address.match(/([\u4e00-\u9fa5]{2,5}市|[\u4e00-\u9fa5]{2,5}区|[\u4e00-\u9fa5]{2,5}县)/);
    if (match) return match[1];
    const parts = address.split(/[省市自治区特别行政区]/);
    for (const p of parts) {
      if (p && p.length >= 2 && p.length <= 5) return p;
    }
    return '';
  }

  async function fetchWeather(city) {
    const weatherInfo = document.getElementById('weatherInfo');
    weatherInfo.textContent = '加载中...';
    try {
      let w = null;
      let cityName = city;
      try {
        const res = await fetch('https://uapis.cn/api/v1/misc/weather?city=' + encodeURIComponent(city), { headers: apiHeaders });
        const data = await res.json();
        console.log('[Weather API] uapis.cn response:', data);
        if (data) {
          if (data.code === 0 && data.data) {
            w = data.data;
          } else if (data.weather !== undefined || data.temperature !== undefined) {
            w = data;
          }
        }
      } catch (e1) {
        console.warn('[Weather API] uapis.cn failed, trying fallback...', e1);
      }

      if (!w) {
        try {
          const res2 = await fetch('https://v2.xxapi.cn/api/tianqi?city=' + encodeURIComponent(city), { headers: apiHeaders });
          const data2 = await res2.json();
          console.log('[Weather API] fallback response:', data2);
          if (data2 && data2.code === 200 && data2.data) {
            w = data2.data;
          } else if (data2 && (data2.weather !== undefined || data2.temperature !== undefined)) {
            w = data2;
          }
        } catch (e2) {
          console.warn('[Weather API] fallback also failed:', e2);
        }
      }

      if (w) {
        cityName = w.city || city;
        const weatherText = w.weather || w.text || w.info || w.tianqi || '';
        let temp = w.temperature !== undefined ? w.temperature : (w.temp !== undefined ? w.temp : '');
        const windDirection = w.wind_direction || w.windDirection || w.fengxiang || '';
        const windScale = w.wind_power || w.wind_scale || w.windScale || w.wind_level || w.fengli || '';
        const humidity = w.humidity !== undefined ? w.humidity : (w.shidu !== undefined ? w.shidu : '');

        let html = '<div class="weather-city">' + cityName + '</div>';
        if (weatherText || temp !== '') {
          html += '<div class="weather-main">';
          if (weatherText) html += '<span class="weather-text">' + weatherText + '</span>';
          if (temp !== '') html += '<span class="weather-temp">' + temp + '°C</span>';
          html += '</div>';
        }
        if (windDirection || windScale || humidity !== '') {
          html += '<div class="weather-sub">';
          if (windDirection) html += '<span>' + windDirection + '</span>';
          if (windScale) html += '<span>' + windScale + '</span>';
          if (humidity !== '') html += '<span>湿度' + humidity + '%</span>';
          html += '</div>';
        }
        weatherInfo.innerHTML = html;
      } else {
        weatherInfo.innerHTML = '<div class="weather-city">' + city + '</div><div class="weather-sub">天气暂不可用</div>';
      }
    } catch (e) {
      console.error('[Weather API] fatal error:', e);
      weatherInfo.innerHTML = '<div class="weather-city">' + city + '</div><div class="weather-sub">天气获取失败</div>';
    }
  }

  function getCurrentShichenIndex(hour) {
    if (hour === 23 || hour === 0) return 0;
    return Math.floor((hour + 1) / 2);
  }

  const huangliModal = document.getElementById('huangliModal');
  const huangliCard = document.getElementById('huangliCard');
  const hlCloseBtn = document.getElementById('hlCloseBtn');
  let huangliLoaded = false;

  function openHuangliModal() {
    huangliModal.classList.add('active');
    document.body.style.overflow = 'hidden';
    if (!huangliLoaded) {
      fetchHuangli();
      huangliLoaded = true;
    }
  }

  function closeHuangliModal() {
    huangliModal.classList.remove('active');
    document.body.style.overflow = '';
  }

  huangliCard.addEventListener('click', (e) => {
    e.preventDefault();
    openHuangliModal();
  });

  hlCloseBtn.addEventListener('click', closeHuangliModal);

  huangliModal.addEventListener('click', (e) => {
    if (e.target === huangliModal) closeHuangliModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && huangliModal.classList.contains('active')) {
      closeHuangliModal();
    }
  });

  async function fetchHuangli() {
    try {
      const res = await fetch('https://api.timelessq.com/time/shichen', { headers: apiHeaders });
      const json = await res.json();
      if (json.errno === 0 && Array.isArray(json.data)) {
        const now = new Date();
        const idx = getCurrentShichenIndex(now.getHours());
        const info = json.data[idx];
        if (info) {
          document.getElementById('hlShichen').textContent = info.hour + ' · ' + info.hours;
          document.getElementById('hlYi').textContent = info.yi || '无';
          document.getElementById('hlJi').textContent = info.ji || '无';
          document.getElementById('hlChong').textContent = info.chong || '—';
          document.getElementById('hlSha').textContent = info.sha || '—';
          document.getElementById('hlNayin').textContent = '纳音：' + (info.nayin || '—');
          document.getElementById('hlJiuxing').textContent = '九星：' + (info.jiuxing || '—');
        }
        renderShichenList(json.data, idx);
      }
    } catch (e) {
      document.getElementById('hlShichen').textContent = '加载失败';
      document.getElementById('hlYi').textContent = '—';
      document.getElementById('hlJi').textContent = '—';
    }
  }

  function parseShichenEndTime(hours) {
    const match = hours.match(/(\d{1,2}):\d{2}-(\d{1,2}):(\d{2})/);
    if (!match) return null;
    const endHour = parseInt(match[2]);
    const endMin = parseInt(match[3]);
    const now = new Date();
    const endTime = new Date(now);
    endTime.setHours(endHour, endMin, 0, 0);
    return endTime;
  }

  function getShichenStatus(item, currentIdx, i) {
    const endTime = parseShichenEndTime(item.hours);
    const now = new Date();
    if (i === currentIdx) return 'current';
    if (endTime && now > endTime) return 'past';
    return 'future';
  }

  function renderShichenList(list, currentIdx) {
    const container = document.getElementById('hlShichenList');
    const shichenData = list.map((item, i) => {
      const yiText = item.yi || '';
      const jiText = item.ji || '';
      const hasYi = yiText && yiText !== '无' && yiText !== '诸事不宜';
      const hasJi = jiText && jiText !== '无' && jiText !== '诸事不宜';
      const status = getShichenStatus(item, currentIdx, i);

      let type;
      if (hasYi && !hasJi) {
        type = 'yi';
      } else if (hasJi && !hasYi) {
        type = 'ji';
      } else if (hasYi && hasJi) {
        type = yiText.length >= jiText.length ? 'yi' : 'ji';
      } else {
        type = 'yi';
      }

      return {
        hour: item.hour,
        hours: item.hours,
        type,
        status,
        idx: i
      };
    });

    let html = '<div class="shichen-group-title">📜 十二时辰（按时间顺序）</div>';

    shichenData.forEach(item => {
      const classes = ['shichen-item', item.type, item.status];
      const statusLabel = item.status === 'past' ? '（已过）' : item.status === 'current' ? '（当前）' : '';
      html += `<div class="${classes.join(' ')}">
        <span class="sc-name">${item.hour}${statusLabel}</span>
        <span class="sc-time">${item.hours}</span>
        <span class="sc-tag ${item.type}">${item.type === 'yi' ? '吉' : '凶'}</span>
      </div>`;
    });

    container.innerHTML = html;
  }

  // 求签弹窗逻辑
  const qiuqianModal = document.getElementById('qiuqianModal');
  const qiuqianCard = document.getElementById('qiuqianCard');
  const qqCloseBtn = document.getElementById('qqCloseBtn');
  const qqBtn = document.getElementById('qqBtn');
  const qqTitle = document.getElementById('qqTitle');
  const qqContent = document.getElementById('qqContent');
  const qqFooter = document.getElementById('qqFooter');
  const qqNumber = document.getElementById('qqNumber');
  const qqType = document.getElementById('qqType');

  function openQiuqianModal() {
    qiuqianModal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeQiuqianModal() {
    qiuqianModal.classList.remove('active');
    document.body.style.overflow = '';
  }

  qiuqianCard.addEventListener('click', (e) => {
    e.preventDefault();
    openQiuqianModal();
  });

  qqCloseBtn.addEventListener('click', closeQiuqianModal);

  qiuqianModal.addEventListener('click', (e) => {
    if (e.target === qiuqianModal) closeQiuqianModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && qiuqianModal.classList.contains('active')) {
      closeQiuqianModal();
    }
  });

  async function fetchQiuqian() {
    qqBtn.classList.add('loading');
    qqBtn.textContent = '正在求签...';
    qqContent.innerHTML = '<div class="qiuqian-placeholder">🔮 神明指引中...</div>';
    qqFooter.style.display = 'none';

    try {
      const res = await fetch('https://v2.xxapi.cn/api/wenchangdijunrandom', { headers: apiHeaders });
      const json = await res.json();

      if (json.code === 200 && json.data) {
        const data = json.data;
        qqTitle.textContent = '🎋 ' + (data.name || '文昌帝君灵签');

        let html = '';
        if (data.poem) {
          html += `<div class="qiuqian-poem">${data.poem.replace(/\n/g, '\n')}</div>`;
        }
        if (data.meaning) {
          html += `<div class="qiuqian-meaning">${data.meaning}</div>`;
        }
        qqContent.innerHTML = html || '<div class="qiuqian-placeholder">签文已出，静心体悟</div>';

        if (data.number || data.type) {
          qqNumber.textContent = data.number ? `第 ${data.number} 签` : '';
          qqType.textContent = data.type || '';
          qqFooter.style.display = 'block';
        }
      } else {
        qqContent.innerHTML = '<div class="qiuqian-placeholder">求签失败，请重试</div>';
      }
    } catch (e) {
      qqContent.innerHTML = '<div class="qiuqian-placeholder">网络错误，请重试</div>';
    } finally {
      qqBtn.classList.remove('loading');
      qqBtn.textContent = '🙏 再次求签';
    }
  }

  qqBtn.addEventListener('click', fetchQiuqian);
</script>
